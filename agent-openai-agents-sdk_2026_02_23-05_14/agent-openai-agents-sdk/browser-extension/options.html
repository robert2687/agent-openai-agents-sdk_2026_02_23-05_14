<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PERFECT Agent Extension Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>PERFECT Agent Extension Settings</h1>
      <label>
        Backend base URL
        <input id="baseUrl" value="http://localhost:8000" />
      </label>
      <label>
        Timeout (ms)
        <input id="timeoutMs" type="number" value="30000" min="1000" step="1000" />
      </label>

      <div class="actions">
        <button id="save">Save</button>
        <button id="clearHistory">Clear Chat History</button>
      </div>

      <p id="status"></p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
