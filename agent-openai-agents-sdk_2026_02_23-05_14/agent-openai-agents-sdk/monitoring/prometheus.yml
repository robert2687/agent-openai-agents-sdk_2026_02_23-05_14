global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape API server
  - job_name: "agent-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s

  # Scrape Redis
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    metrics_path: "/metrics"

  # Scrape Cosmos DB (if available)
  - job_name: "cosmosdb"
    static_configs:
      - targets: ["cosmosdb:8081"]
    metrics_path: "/metrics"

# Alert rules
rule_files:
  - "/etc/prometheus/alerts.yml"

# Remote write configuration (optional - uncomment to send to external Prometheus)
