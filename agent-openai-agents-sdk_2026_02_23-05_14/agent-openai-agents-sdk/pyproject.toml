[project]
name = "agent-openai-agents-sdk"
version = "0.2.0"
description = "Multi-agent SDK with PERFECT-AGENT (Nemotron fallback)"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "openai-agents>=0.0.3",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gradio>=4.0",
    "httpx>=0.26.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.0",
    "mlflow>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
ui = ["gradio"]
databricks = ["databricks-openai>=0.9.0", "databricks-agents", "unitycatalog-openai[databricks]>=0.2.0"]
cosmos = ["azure-cosmos>=4.0"]
redis = ["redis>=5.0"]
monitoring = ["prometheus-client", "structlog"]
security = ["bandit", "safety"]
lint = ["ruff>=0.1.0", "mypy>=1.0"]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pytest-cov>=4.0", "httpx"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "bandit>=1.7.0",
    "safety>=2.0",
    "pdoc>=14.0",
    "structlog>=23.0",
]

[project.scripts]
perfect-agent = "local_agents.perfect_agent.runner:main"
quickstart = "scripts.quickstart:main"
verify-setup = "verify_setup:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
discover-tools = "scripts.discover_tools:main"
package-browser-extension = "scripts.package_browser_extension:main"

[tool.setuptools.package-data]
"local_agents.perfect_agent" = ["system_prompt.txt"]
"agent_server" = ["py.typed"]

[tool.setuptools]
include-package-data = true
py-modules = ["verify_setup", "standalone_server", "setup_and_launch"]

[tool.setuptools.packages.find]
include = ["agent_server*", "local_agents*", "api*", "ui*", "scripts*", "sdk*", "monitoring*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EXE", # flake8-executable-permissions
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PLC", # pylint - convention
    "PLE", # pylint - error
    "PLW", # pylint - warning
    "PLR", # pylint - refactor
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "PLR0911", # too many ancestors
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLC0415", # import should be at top of file
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]  # assert_used

[tool.coverage.run]
source = ["agent_server", "local_agents", "api", "sdk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
