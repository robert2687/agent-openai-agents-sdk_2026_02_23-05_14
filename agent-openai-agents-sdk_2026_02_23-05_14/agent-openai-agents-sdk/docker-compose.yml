version: "3.9"

services:
  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator
    container_name: cosmosdb-emulator
    restart: unless-stopped
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 3
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"
    volumes:
      - cosmosdata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: perfect-agent-api
    env_file: .env
    environment:
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "${API_PORT:-8000}:8000"

  ui:
    image: python:3.11-slim
    container_name: perfect-agent-ui
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    environment:
      API_BASE_URL: "http://api:8000"
    command: >
      sh -c "pip install --no-cache-dir -e . gradio httpx &&
             python ui/perfect_agent_gradio.py"
    depends_on:
      - api
    ports:
      - "${UI_PORT:-7860}:7860"

volumes:
  cosmosdata:
