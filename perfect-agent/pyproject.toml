[project]
name = "perfect-agent"
version = "0.2.0"
description = "PERFECT-AGENT — deterministic, tool-using assistant with Nemotron → Qwen → GPT-4.1 fallback."
authors = [{ name = "Agent Developer", email = "developer@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.scripts]
perfect-agent = "agent.runner:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.setuptools.package-data]
"agent" = ["system_prompt.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
