[project]
name = "perfect-agent"
version = "0.2.1"
description = "PERFECT-AGENT — deterministic, tool-using assistant with Nemotron → Qwen → GPT-4.1 fallback."
authors = [{ name = "Agent Developer", email = "developer@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
perfect-agent = "agent.runner:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.setuptools.package-data]
"agent" = ["system_prompt.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]